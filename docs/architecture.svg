<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">Michelangelo on OCI reference architecture</title>
<desc id="desc">All-in-one release 0.12.0-oci.1-rc.1. Public load balancer forwards TCP to Caddy and OAuth2 Proxy on private OKE nodes. OCI IAM authenticates users. Studio, API, controllers and Temporal coordinate Ray training and private Triton serving. MySQL persists metadata, workflow state and identities. Object Storage stores artifacts and lifecycle logs; OCIR holds images. A public build host installs through the private OKE API. This is a source reference, not a production or availability certification.</desc>
