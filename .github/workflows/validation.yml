name: Candidate validation
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -B -m unittest discover -s all-in-one/tests -p 'test_*.py'
      - run: python -B all-in-one/scripts/check-publication.py
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -B all-in-one/scripts/check-source.py --work-dir "$RUNNER_TEMP/ma-source"
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {profile: all-in-one, version: '1.5.7'}
          - {profile: terraform, version: '1.6.6'}
          - {profile: resource-manager, version: '1.5.7'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ matrix.version }}
      - name: Extract the distributable profile
        run: |
          python3 -B all-in-one/scripts/package-stack.py --profile '${{ matrix.profile }}' --output "$RUNNER_TEMP/site.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/site.zip" "$RUNNER_TEMP/ma-profile"
      # The extracted workspace may add authenticated host-platform hashes;
      # provider versions remain selected by the shipped lock, without -upgrade.
      - run: terraform init -backend=false -input=false
        working-directory: ${{ runner.temp }}/ma-profile
      - run: terraform validate
        working-directory: ${{ runner.temp }}/ma-profile
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
